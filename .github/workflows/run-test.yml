name: Perform Test

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  static_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - run: pip install cpplint
    - run: cpplint --recursive --filter=-whitespace,-build,-readability .

  dynamic_test:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, armhf, arm64]
        include:
        - arch: amd64
          cc: ''
        - arch: armhf
          cc: arm-linux-gnueabihf
        - arch: arm64
          cc: aarch64-linux-gnu

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool help2man make expect exfatprogs
    - name: automake
      run: ./scripts/bootstrap.sh
    - name: native compiler
      if: matrix.arch == 'amd64'
      run: |
        ./configure
    - name: cross compiler
      if: matrix.arch != 'amd64'
      run: |
        sudo apt-get install -y crossbuild-essential-${{ matrix.arch }}
        ./configure --host=${{ matrix.cc }}
    - name: build package
      run: make
    - name: perform testing
      run: make check || ./scripts/correct_log.sh ${{ matrix.arch }}
    - if: always()
      uses: actions/upload-artifact@v6
      with:
        name: logs-test-${{ matrix.arch }}
        path: logs
        retention-days: 1
